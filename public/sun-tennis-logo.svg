<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 배경 그라데이션 -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>

    <!-- 테니스볼 그라데이션 -->
    <radialGradient id="ballGlow" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#ccff00" />
      <stop offset="85%" stop-color="#65a30d" />
      <stop offset="100%" stop-color="#3f6212" />
    </radialGradient>

    <!-- 태양 광선 그라데이션 -->
    <linearGradient id="rayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- 골드 링 그라데이션 -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- 에메랄드 리본 그라데이션 -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 원형 배경 광채 -->
  <circle cx="250" cy="250" r="230" fill="url(#sunGlow)" opacity="0.35" />

  <!-- 태양 광선 (16개 역동적인 레이) -->
  <g filter="url(#glowFilter)" opacity="0.95">
    <path d="M 250,20 L 260,70 L 240,70 Z" fill="url(#rayGrad)" />
    <path d="M 250,480 L 260,430 L 240,430 Z" fill="url(#rayGrad)" />
    <path d="M 20,250 L 70,260 L 70,240 Z" fill="url(#rayGrad)" />
    <path d="M 480,250 L 430,260 L 430,240 Z" fill="url(#rayGrad)" />

    <path d="M 87,87 L 130,115 L 115,130 Z" fill="url(#rayGrad)" />
    <path d="M 413,87 L 385,130 L 370,115 Z" fill="url(#rayGrad)" />
    <path d="M 87,413 L 115,370 L 130,385 Z" fill="url(#rayGrad)" />
    <path d="M 413,413 L 370,385 L 385,370 Z" fill="url(#rayGrad)" />

    <path d="M 155,40 L 175,85 L 158,95 Z" fill="url(#rayGrad)" />
    <path d="M 345,40 L 342,95 L 325,85 Z" fill="url(#rayGrad)" />
    <path d="M 155,460 L 158,405 L 175,415 Z" fill="url(#rayGrad)" />
    <path d="M 345,460 L 325,415 L 342,405 Z" fill="url(#rayGrad)" />

    <path d="M 40,155 L 85,175 L 95,158 Z" fill="url(#rayGrad)" />
    <path d="M 40,345 L 95,342 L 85,325 Z" fill="url(#rayGrad)" />
    <path d="M 460,155 L 405,158 L 415,175 Z" fill="url(#rayGrad)" />
    <path d="M 460,345 L 415,325 L 405,342 Z" fill="url(#rayGrad)" />
  </g>

  <!-- 외곽 썬 테니스 챔피언 링 -->
  <circle cx="250" cy="250" r="170" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-dasharray="14 6" opacity="0.85" />
  <circle cx="250" cy="250" r="158" fill="#042f2e" stroke="url(#ringGrad)" stroke-width="4" filter="url(#shadowFilter)" />

  <!-- 중앙 썬 테니스볼 본체 -->
  <circle cx="250" cy="250" r="120" fill="url(#ballGlow)" filter="url(#shadowFilter)" />

  <!-- 테니스 볼 입체 솔기 (Seam lines) -->
  <!-- 왼쪽 커브 솔기 -->
  <path d="M 175,155 C 225,185 225,315 175,345" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" opacity="0.9" filter="url(#glowFilter)" />
  <path d="M 175,155 C 225,185 225,315 175,345" fill="none" stroke="#fef08a" stroke-width="3" stroke-linecap="round" opacity="0.8" />

  <!-- 오른쪽 커브 솔기 -->
  <path d="M 325,155 C 275,185 275,315 325,345" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" opacity="0.9" filter="url(#glowFilter)" />
  <path d="M 325,155 C 275,185 275,315 325,345" fill="none" stroke="#fef08a" stroke-width="3" stroke-linecap="round" opacity="0.8" />

  <!-- 중앙 SUN 영문 로고 타이포그래피 배너 -->
  <g filter="url(#shadowFilter)">
    <rect x="110" y="222" width="280" height="56" rx="28" fill="#0f172a" stroke="url(#ringGrad)" stroke-width="3" />
    <text x="250" y="260" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#fde047" text-anchor="middle" letter-spacing="4">
      SUN CLUB
    </text>
  </g>

  <!-- 상단 및 하단 리본 텍스트 -->
  <text x="250" y="145" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="16" font-weight="800" fill="#fef08a" text-anchor="middle" letter-spacing="3" opacity="0.95">
    EST. 2026
  </text>
  <text x="250" y="365" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    썬 테니스 클럽
  </text>
</svg>
